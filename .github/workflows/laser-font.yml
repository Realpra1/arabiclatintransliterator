name: Laser font geometry

on:
  push:
  pull_request:

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-font.txt
      - run: python -B -m unittest discover -s tests -p test_laser_font.py -v
